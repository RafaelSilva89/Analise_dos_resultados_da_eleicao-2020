name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Os testes usam src/eleicao.py, src/dados_externos.py e src/selecao.py e as funções de avaliação e estatística
      - run: pip install pandas numpy scipy scikit-learn matplotlib seaborn pytest
      - run: pytest -v
