name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Os testes só usam src/eleicao.py e src/dados_externos.py, que dependem apenas de pandas e numpy
      - run: pip install pandas numpy pytest
      - run: pytest -v
